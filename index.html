<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔫 星际射手 </title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: #0a0f1e; min-height: 100vh; display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden;
        }
        .game-container {
            position: relative; background: #151e2a; padding: 10px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            width: 100%; max-width: 840px; max-height: 100vh;
            display: flex; flex-direction: column;
        }
        canvas {
            display: block; margin: 0 auto; border-radius: 10px; background: #0b1119; box-shadow: 0 0 0 2px #2e4b6e;
            cursor: crosshair; width: 100%; height: auto; max-height: 65vh; object-fit: contain;
            touch-action: none; /* 防止触摸时页面滚动 */
        }
        .status-bar {
            display: flex; justify-content: space-between; align-items: center; margin: 8px 0 0;
            color: #b7e1ff; flex-wrap: wrap; gap: 6px; font-size: 0.9rem;
        }
        .score-board, .hp-board {
            background: #1e2b3a; padding: 4px 12px; border-radius: 30px; border: 1px solid #3c6e9c; font-size: 1rem;
        }
        .hp-hearts { color: #ff5e6b; font-size: 1.1rem; }
        .progress-container {
            flex: 1; min-width: 80px; height: 12px; background: #0f1a24; border-radius: 10px;
            border: 1px solid #3c6e9c; overflow: hidden;
        }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #3f9eff, #a855f7); transition: width 0.2s; }
        button {
            background: #2e4b6e; border: none; color: white; font-weight: bold; padding: 6px 14px;
            border-radius: 30px; cursor: pointer; border: 1px solid #5f9bd1; transition: transform 0.1s; outline: none;
            font-size: 0.9rem;
        }
        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.5; }
        .tip { color: #7d9fc0; font-size: 0.75rem; text-align: center; margin-top: 6px; display: flex; justify-content: center; gap: 10px;}
        .tip span { background: rgba(62, 110, 156, 0.3); padding: 2px 8px; border-radius: 10px;}

        #skillBtn { background: #8b5cf6; border-color: #a78bfa; }
        #skillBtn.cooldown { background: #4b5563; border-color: #6b7280; color: #9ca3af; }
        .shield-charges { font-size: 1rem; margin-left: 3px; }
        
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; border-radius: 15px; background: rgba(10, 15, 26, 0.95);
            z-index: 100; pointer-events: auto; padding: 15px;
        }
        .overlay.hidden { display: none; }
        .overlay h2 { font-size: 2rem; margin-bottom: 15px; color: #fff; text-shadow: 0 0 15px #3f9eff; text-align: center; }

        .mode-select { display: flex; flex-direction: column; gap: 10px; margin: 10px 0; width: 100%; max-width: 300px; }
        .mode-card {
            background: #1e2b3a; border: 2px solid #3c6e9c; border-radius: 12px; padding: 12px;
            cursor: pointer; text-align: center; transition: all 0.2s;
        }
        .mode-card:active { border-color: #3f9eff; background: #25384a; }
        .mode-card h3 { font-size: 1.3rem; color: #ffd966; margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .upgrade-panel, .pause-menu, .difficulty-panel {
            background: #1e2b3a; padding: 15px; border-radius: 15px; border: 2px solid #3c6e9c;
            text-align: center; max-width: 100%; width: 95%; max-height: 85vh; overflow-y: auto;
        }
        .upgrade-panel h3, .pause-menu h3, .difficulty-panel h3 { font-size: 1.5rem; margin-bottom: 10px; color: #ffd966; }
        .upgrade-stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 10px; font-size: 1rem; color: #b7e1ff; }
        .gem-display { color: #ffd966; font-size: 1.3rem; font-weight: bold; }
        .upgrade-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .upgrade-item {
            display: flex; justify-content: space-between; align-items: center; background: #0f1a24;
            padding: 8px 10px; border-radius: 10px; border: 1px solid #2e4b6e; font-size: 0.9rem;
        }
        .upgrade-item span { color: #b7e1ff; }
        .upgrade-item .cost { color: #ffd966; font-weight: bold; }
        .back-btn { background: #6b3e3e; border-color: #a05a5a; width: 100%; margin-top: 10px; padding: 10px; font-size: 1rem;}

        .corner-back {
            position: absolute; top: 10px; left: 10px; z-index: 120;
            background: #2e4b6e; border-color: #5f9bd1; padding: 6px 14px; font-size: 0.85rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        #gameBackBtn { position: absolute; top: 10px; left: 10px; z-index: 60; padding: 5px 12px; }
        .death-stats { color: #b7e1ff; font-size: 1.05rem; margin: 8px 0 18px; text-align: center; line-height: 1.9; }
        .death-stats b { color: #ffd966; }
        .levelup-options { display: flex; gap: 14px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
        .levelup-card {
            width: 180px; padding: 16px 12px; border-radius: 14px; background: #1e2b3a;
            cursor: pointer; border: 2px solid #555; text-align: center;
        }
        .levelup-card:active { transform: scale(0.96); }
        .levelup-card .r-name { font-size: 0.8rem; margin-bottom: 8px; letter-spacing: 3px; }
        .levelup-card .a-name { font-size: 1.15rem; margin-bottom: 6px; color: #fff; font-weight: bold; }
        .levelup-card .a-desc { font-size: 0.82rem; color: #b7e1ff; line-height: 1.5; }
        .level-grid { display: flex; flex-wrap: wrap; gap: 8px; max-width: 460px; justify-content: center; margin-top: 12px; }
        .level-cell {
            width: 56px; height: 48px; border-radius: 9px; background: #1e2b3a;
            border: 1px solid #3c6e9c; color: #b7e1ff; font-size: 0.95rem; font-weight: bold;
            cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 0;
        }
        .level-cell .lvl-tag { font-size: 0.55rem; font-weight: normal; margin-top: 1px; }
        .level-cell.locked { opacity: 0.35; cursor: not-allowed; }
        .level-cell.boss { border-color: #a855f7; box-shadow: 0 0 6px #a855f755; }
        .level-cell.big { border-color: #f59e0b; box-shadow: 0 0 8px #f59e0b66; }
        .level-cell.rush { border-color: #ef4444; box-shadow: 0 0 10px #ef444466; }
        
        .pause-menu button { width: 100%; margin-bottom: 10px; padding: 10px; font-size: 1rem; }
        .level-display { color: #ffd966; font-size: 1rem; }

        .slider-group { margin-bottom: 12px; text-align: left; font-size: 0.9rem;}
        .slider-group label { display: block; color: #b7e1ff; margin-bottom: 5px; }
        .slider-group input[type="range"] {
            width: 100%; height: 6px; border-radius: 4px; background: #0f1a24; outline: none;
            -webkit-appearance: none; border: 1px solid #3c6e9c;
        }
        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
            background: #3f9eff; cursor: pointer;
        }
        .slider-value { float: right; color: #ffd966; font-weight: bold; }
        .difficulty-bonus {
            display: flex; justify-content: space-between; align-items: center;
            background: #0f1a24; padding: 8px 10px; border-radius: 10px; border: 1px solid #2e4b6e; margin-bottom: 15px;
            font-size: 0.9rem;
        }
        .difficulty-bonus button { background: #eab308; border-color: #facc15; color: #000; padding: 4px 10px; }
        
        #settingsPanel { margin-top: 10px; text-align: left; color: #b7e1ff; font-size: 0.9rem; }
        #settingsPanel label { display: block; margin: 6px 0; }
        #settingsPanel input[type="range"], #settingsPanel select { width: 100%; margin-top: 4px; }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="gameCanvas" width="800" height="550"></canvas>
    <button id="gameBackBtn" class="corner-back">← 返回</button>
    
    <div class="status-bar">
        <div class="score-board">💥 <span id="scoreDisplay">0</span></div>
        <div class="level-display" id="levelDisplay">第 1 关</div>
        <div class="hp-board">❤️ <span class="hp-hearts" id="hpDisplay">❤️❤️❤️</span></div>
        <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    </div>
    <div class="status-bar" style="justify-content: center; margin-top: 4px;">
        <button id="skillBtn">🛡️ 无敌(E) <span class="shield-charges" id="shieldCharges">0/2</span></button>
        <button id="pauseBtn">⏸ 暂停</button>
        <button id="restartBtn">↺ 重来</button>
    </div>
    <div class="tip">
        <span>👆 滑动移动</span>
        <span>👆 按住射击</span>
    </div>

    <!-- 开始界面 -->
    <div id="startOverlay" class="overlay">
        <h2>✨ 星际射手 ✨</h2>
        <div class="mode-select">
            <div class="mode-card" id="adventureModeBtn"><h3>⚔️ 冒险模式</h3></div>
            <div class="mode-card" id="endlessModeBtn"><h3>♾️ 无限模式</h3></div>
            <div class="mode-card" id="loadGameBtn" style="border-color: #fbbf24;">
                <h3>📂 继续游戏</h3>
                <div style="font-size:0.75rem; color:#7d9fc0; margin-top:5px;" id="saveInfo">（无存档）</div>
            </div>
        </div>
        <div style="display:flex; gap:10px; width:100%; max-width:300px;">
            <button id="upgradeBtn" style="flex:1; font-size: 0.9rem; padding: 8px 0;">⚡ 升级</button>
            <button id="difficultyBtn" style="flex:1; font-size: 0.9rem; padding: 8px 0; background: #6b3e3e;">⚙️ 难度</button>
        </div>
        <!-- 账号登录/注册 -->
        <div id="authPanel" style="width:100%; max-width:300px; margin-top:10px; border:1px solid #3c6e9c; border-radius:10px; padding:10px; background:rgba(15,26,36,0.6);">
            <div id="authLoggedOut">
                <div style="color:#ffd966; font-size:0.85rem; margin-bottom:6px;">👤 账号登录（登录后使用自己的存档）</div>
                <input id="authUser" type="text" placeholder="账号（至少6位）" maxlength="20"
                    style="width:100%; box-sizing:border-box; margin-bottom:6px; padding:7px 10px; background:#0f1a24; color:#b7e1ff; border:1px solid #3c6e9c; border-radius:6px; font-size:0.85rem;">
                <input id="authPass" type="password" placeholder="密码（任意字符）" maxlength="30"
                    style="width:100%; box-sizing:border-box; margin-bottom:8px; padding:7px 10px; background:#0f1a24; color:#b7e1ff; border:1px solid #3c6e9c; border-radius:6px; font-size:0.85rem;">
                <button id="authLoginBtn" style="width:100%; padding:8px 0; font-size:0.9rem; background:#3c6e9c;">登录 / 注册新账号</button>
                <div id="authMsg" style="color:#ff9d9d; font-size:0.75rem; margin-top:6px; min-height:1em;"></div>
            </div>
            <div id="authLoggedIn" style="display:none; text-align:center;">
                <div style="color:#8fe3b0; font-size:0.9rem;">👤 当前账号：<b id="authUserName"></b></div>
                <button id="authLogoutBtn" style="margin-top:8px; padding:5px 16px; font-size:0.8rem; background:#6b3e3e; border-color:#a05a5a;">退出登录（进度已自动保存）</button>
            </div>
        </div>
    </div>

    <!-- 关卡选择界面 (冒险模式) -->
    <div id="levelSelectOverlay" class="overlay hidden">
        <button id="levelSelectBackBtn" class="corner-back">← 返回</button>
        <h3 style="color:#ffd966;">🗺️ 冒险模式 · 关卡选择</h3>
        <p style="color:#8fa8c9; font-size:0.78rem; margin-top:4px;">🕹=小Boss关 · 👑=大Boss关 · ⚔️=终局Boss连战</p>
        <div id="levelGrid" class="level-grid"></div>
    </div>

    <!-- 升级界面 -->
    <div id="upgradeOverlay" class="overlay hidden">
        <button id="upgradeBackBtn" class="corner-back">← 返回</button>
        <div class="upgrade-panel">
            <h3>⚡ 升级中心</h3>
            <div class="upgrade-stats">
                <div>💎 水晶: <span id="gemDisplay" class="gem-display">0</span></div>
                <div>📊 得分: <span id="upgradeScoreDisplay">0</span></div>
            </div>
            <div class="upgrade-list" id="upgradeList"></div>
            <button id="closeUpgradeBtn" class="back-btn">← 返回</button>
        </div>
    </div>

    <!-- 暂停/设置菜单 -->
    <div id="pauseOverlay" class="overlay hidden">
        <button id="pauseBackBtn" class="corner-back">← 返回</button>
        <div class="pause-menu">
            <h3>⏸ 游戏暂停</h3>
            <button id="resumeBtn">▶ 继续游戏</button>
            <button id="saveAndExitBtn" style="background:#3c6e9c;">💾 保存并退出</button>
            <button id="pauseDifficultyBtn" style="background:#3c6e9c;">🎚️ 难度设置</button>
            <button id="settingsBtn" style="background:#6b3e3e;">⚙️ 设置</button>
            <div id="settingsPanel" style="display:none;">
                <button id="settingsBackBtn" style="background:#6b3e3e; border-color:#a05a5a; padding:4px 12px; font-size:0.8rem; margin-bottom:8px;">← 返回</button>
                <label>🔊 音效音量 <input type="range" id="volumeSfx" min="0" max="100" value="80"></label>
                <label>🎵 背景音乐 <input type="range" id="volumeMusic" min="0" max="100" value="50"></label>
                <label>🖥️ 画质 <select id="qualitySelect" style="background:#0f1a24; color:#b7e1ff; border:1px solid #3c6e9c; border-radius:6px; padding:4px;">
                    <option>低</option><option selected>中</option><option>高</option>
                </select></label>
                <div style="border-top:1px solid #3c6e9c; margin-top:10px; padding-top:8px;">
                    <div style="color:#ffd966; font-size:0.85rem; margin-bottom:6px;">⌨️ 键盘按键（点击后按新键）</div>
                    <div id="keybindList" style="display:flex; flex-wrap:wrap; gap:6px; justify-content:center;"></div>
                    <div style="color:#ffd966; font-size:0.85rem; margin:10px 0 4px;">🖱️ 鼠标按键</div>
                    <div style="font-size:0.8rem; color:#b7e1ff; display:flex; gap:12px; justify-content:center; align-items:center;">
                        <span>攻击 <select id="mouseAttackSel" style="background:#0f1a24; color:#b7e1ff; border:1px solid #3c6e9c; border-radius:6px; padding:2px 6px;">
                            <option value="0">左键</option><option value="1">中键</option><option value="2">右键</option>
                        </select></span>
                        <span>技能 <select id="mouseSkillSel" style="background:#0f1a24; color:#b7e1ff; border:1px solid #3c6e9c; border-radius:6px; padding:2px 6px;">
                            <option value="0">左键</option><option value="1">中键</option><option value="2">右键</option>
                        </select></span>
                    </div>
                    <button id="keybindResetBtn" style="margin-top:10px; padding:4px 12px; font-size:0.8rem; background:#6b3e3e; border-color:#a05a5a;">🔄 恢复默认按键</button>
                </div>
            </div>
            <div class="save-slot-info" id="pauseSaveInfo" style="font-size:0.8rem; margin-top:10px; color:#b7e1ff;"></div>
        </div>
    </div>

    <!-- 难度调节界面 -->
    <div id="difficultyOverlay" class="overlay hidden">
        <button id="difficultyBackBtn" class="corner-back">← 返回</button>
        <div class="difficulty-panel">
            <h3>⚙️ 自定义难度</h3>
            <div class="slider-group">
                <label>敌人生成速度 <span id="valSpawnRate" class="slider-value">1.0x</span></label>
                <input type="range" id="sliderSpawnRate" min="0.5" max="10.0" step="0.1" value="1.0">
            </div>
            <div class="slider-group">
                <label>敌人移动速度 <span id="valEnemySpeed" class="slider-value">1.0x</span></label>
                <input type="range" id="sliderEnemySpeed" min="0.5" max="10.0" step="0.1" value="1.0">
            </div>
            <div class="slider-group">
                <label>小怪血量倍率 <span id="valEnemyHp" class="slider-value">1.0x</span></label>
                <input type="range" id="sliderEnemyHp" min="0.5" max="10.0" step="0.1" value="1.0">
            </div>
            <div class="slider-group">
                <label>Boss生命值 <span id="valBossHp" class="slider-value">1.0x</span></label>
                <input type="range" id="sliderBossHp" min="0.5" max="10.0" step="0.1" value="1.0">
            </div>
            <div class="slider-group">
                <label>Boss攻击频率 <span id="valBossRate" class="slider-value">1.0x</span></label>
                <input type="range" id="sliderBossRate" min="0.5" max="10.0" step="0.1" value="1.0">
            </div>
            <div class="slider-group">
                <label>Boss进度条阈值 <span id="valBossThreshold" class="slider-value">50</span></label>
                <input type="range" id="sliderBossThreshold" min="50" max="500" step="10" value="50">
            </div>
            <div class="difficulty-bonus">
                <span>💀 难度翻倍</span>
                <button id="btnDoubleDifficulty">当前: 1.0x</button>
            </div>
            <button id="closeDifficultyBtn" class="back-btn">← 保存并返回</button>
        </div>
    </div>

    <!-- 确认弹窗 -->
    <div id="confirmOverlay" class="overlay hidden" style="z-index:150;">
        <div class="pause-menu">
            <h3 id="confirmMsg" style="font-size:1.1rem;">确定吗？</h3>
            <button id="confirmYesBtn" style="background:#a04b4b;">✔ 确定</button>
            <button id="confirmNoBtn" style="background:#3c6e9c;">✖ 取消</button>
        </div>
    </div>

    <!-- 死亡/结算界面 -->
    <div id="deathOverlay" class="overlay hidden">
        <button id="deathBackBtn" class="corner-back">← 返回</button>
        <h2 id="deathTitle">💀 你已坠机</h2>
        <div class="death-stats" id="deathStats"></div>
        <button id="deathContinueBtn" style="background:#2e8b57; padding:10px 30px; font-size:1rem; margin-bottom:10px; display:none;">🚀 继续挑战</button>
        <button id="deathConfirmBtn" style="background:#3c6e9c; padding:10px 30px; font-size:1rem;">✔ 确认返回菜单</button>
    </div>

    <!-- 局内升级选择界面 -->
    <div id="levelUpOverlay" class="overlay hidden">
        <h3 style="color:#ffd966;">⬆️ 机体强化</h3>
        <p style="color:#b7e1ff; font-size:0.9rem;">击坠达标！选择一项强化（仅当局有效）</p>
        <div id="levelUpOptions" class="levelup-options"></div>
        <p id="levelUpPity" style="color:#8fa8c9; font-size:0.75rem; margin-top:10px;"></p>
    </div>
</div>

<script>
    (function() {
        // 元素引用
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const hpSpan = document.getElementById('hpDisplay');
        const gemSpan = document.getElementById('gemDisplay');
        const upgradeScoreSpan = document.getElementById('upgradeScoreDisplay');
        const levelDisplay = document.getElementById('levelDisplay');
        const progressBar = document.getElementById('progressBar');
        const pauseBtn = document.getElementById('pauseBtn');
        const skillBtn = document.getElementById('skillBtn');
        const shieldChargesSpan = document.getElementById('shieldCharges');
        const confirmOverlay = document.getElementById('confirmOverlay');
        const confirmMsg = document.getElementById('confirmMsg');
        const confirmYesBtn = document.getElementById('confirmYesBtn');
        const confirmNoBtn = document.getElementById('confirmNoBtn');
        const volumeSfx = document.getElementById('volumeSfx');
        const volumeMusic = document.getElementById('volumeMusic');
        const qualitySelect = document.getElementById('qualitySelect');
        const pauseDifficultyBtn = document.getElementById('pauseDifficultyBtn');
        const startOverlay = document.getElementById('startOverlay');
        const upgradeOverlay = document.getElementById('upgradeOverlay');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const difficultyOverlay = document.getElementById('difficultyOverlay');
        const upgradeListEl = document.getElementById('upgradeList');
        
        const adventureModeBtn = document.getElementById('adventureModeBtn');
        const endlessModeBtn = document.getElementById('endlessModeBtn');
        const loadGameBtn = document.getElementById('loadGameBtn');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const difficultyBtn = document.getElementById('difficultyBtn');
        const closeUpgradeBtn = document.getElementById('closeUpgradeBtn');
        const closeDifficultyBtn = document.getElementById('closeDifficultyBtn');
        const restartBtn = document.getElementById('restartBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const saveAndExitBtn = document.getElementById('saveAndExitBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const saveInfo = document.getElementById('saveInfo');
        const pauseSaveInfo = document.getElementById('pauseSaveInfo');
        const deathOverlay = document.getElementById('deathOverlay');
        const deathTitle = document.getElementById('deathTitle');
        const deathStats = document.getElementById('deathStats');
        const deathConfirmBtn = document.getElementById('deathConfirmBtn');
        const deathBackBtn = document.getElementById('deathBackBtn');
        const upgradeBackBtn = document.getElementById('upgradeBackBtn');
        const pauseBackBtn = document.getElementById('pauseBackBtn');
        const difficultyBackBtn = document.getElementById('difficultyBackBtn');
        const settingsBackBtn = document.getElementById('settingsBackBtn');
        const gameBackBtn = document.getElementById('gameBackBtn');
        const deathContinueBtn = document.getElementById('deathContinueBtn');
        const levelUpOverlay = document.getElementById('levelUpOverlay');
        const levelUpOptions = document.getElementById('levelUpOptions');
        const levelUpPity = document.getElementById('levelUpPity');

        const btnDoubleDifficulty = document.getElementById('btnDoubleDifficulty');

        const CW = 800, CH = 550;

        // ===== 账号系统 =====
        // 账号至少6位、密码任意；每个账号拥有独立的存档/水晶/升级/关卡解锁进度。
        // 未登录时以"游客"身份游玩（数据独立保存在 _guest 命名空间）。
        const ACCOUNTS_KEY = 'ss_accounts_v1';
        const SESSION_KEY = 'ss_session_v1';
        const SAVE_KEY_BASE = 'interstellar_shooter_save_mobile';
        const UNLOCK_KEY_BASE = 'ss_adventure_unlock_v1';
        let currentUser = null; // 当前登录账号名，null=游客

        function hashPwd(s) { // 轻量混淆哈希（本地游戏，不联网传输）
            let h = 5381;
            for (let i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; }
            return 'h' + h.toString(36) + '_' + s.length;
        }
        function getAccounts() { try { return JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '{}'); } catch(e) { return {}; } }
        function saveAccounts(a) { try { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(a)); } catch(e) {} }
        function storageSuffix() { return currentUser ? '_' + currentUser : '_guest'; }
        function saveKey() { return SAVE_KEY_BASE + storageSuffix(); }
        function unlockKey() { return UNLOCK_KEY_BASE + storageSuffix(); }
        function profileKey() { return 'ss_profile_v1' + storageSuffix(); }

        // 长期进度档案：水晶 + 升级等级 + 冒险解锁进度（随关键节点自动保存）
        function persistProfile() {
            try {
                localStorage.setItem(profileKey(), JSON.stringify({
                    gems, upgradeLevels: { ...upgradeLevels }, unlock: loadUnlock()
                }));
            } catch(e) {}
        }
        function loadProfileIntoGame() {
            try {
                const p = JSON.parse(localStorage.getItem(profileKey()) || 'null');
                if (p) {
                    if (typeof p.gems === 'number') gems = p.gems;
                    if (p.upgradeLevels) {
                        upgradeLevels = { bulletCount: 1, spread: 1, fireRate: 1, life: 1, activeShieldDuration: 1, activeShieldCooldown: 1, damage: 1, ...p.upgradeLevels };
                        for (const k in upgradeLevels) upgradeLevels[k] = Math.min(upgradeLevels[k], 20);
                    }
                    saveUnlock(p.unlock || 1);
                } else {
                    saveUnlock(1);
                }
            } catch(e) {}
        }
        function loginAccount(name, pwd) {
            if (!name || name.length < 6) return '账号至少需要6位';
            if (!pwd) return '密码不能为空';
            const accounts = getAccounts();
            if (accounts[name]) {
                if (accounts[name].p !== hashPwd(pwd)) return '密码错误，请重试';
            } else {
                accounts[name] = { p: hashPwd(pwd) };
                saveAccounts(accounts);
            }
            setCurrentUser(name);
            return null; // 登录/注册成功
        }
        function setCurrentUser(name) {
            currentUser = name;
            try { name ? localStorage.setItem(SESSION_KEY, name) : localStorage.removeItem(SESSION_KEY); } catch(e) {}

        // 全局状态

        // 护盾系统

        // 升级

        // 难度配置
        let difficulty = {

        // 玩家
        const player = { x: CW/2, y: CH-60, w: 36, h: 28, speed: 6, color: '#7ae0ff' };
        let bullets = [], enemies = [], smallEnemies = [], enemyBullets = [], specialEnemies = [], powerups = [];
        let shootTimer = 0, enemySpawnTimer = 0, gameTime = 0, specialSpawnTimer = 0;
        
        const BULLET_SPEED = -8, BULLET_WIDTH = 4, BULLET_HEIGHT = 14;
        const ENEMY_WIDTH = 36, ENEMY_HEIGHT = 36, SMALL_SIZE = 18;

        // 触控/键盘状态
        let keys = { left: false, right: false, space: false };

        // 辅助函数
        const getFireRateValue = () => 1.0 + (upgradeLevels.fireRate - 1) * 0.1 + tempUpgrades.fireRate * 0.1 + runBonus.fireRate * 0.1;
        const getFireCooldown = () => Math.max(2, Math.floor(60 / (getFireRateValue() * 6))); 
        const getActiveShieldDuration = () => Math.floor(300 + (upgradeLevels.activeShieldDuration - 1) * 12);
        const getActiveShieldCooldown = () => Math.max(60, Math.floor(1800 - (upgradeLevels.activeShieldCooldown - 1) * 12));
        const getDamage = () => 1 + (upgradeLevels.damage - 1) * 0.5 + runBonus.damage;
        
        const getBulletCount = () => upgradeLevels.bulletCount + tempUpgrades.bulletCount;
        const getSpreadCount = () => upgradeLevels.spread;
        const getMaxHp = () => 3 + (upgradeLevels.life - 1) * 1 + runBonus.maxHp;
        const getUpgradeCost = (config) => config.baseCost + (upgradeLevels[config.key] - 1) * 10;

        const getDiffSpawn = () => difficulty.spawnRate * difficulty.multiplier;
        const getDiffSpeed = () => difficulty.enemySpeed * difficulty.multiplier;
        const getDiffEnemyHp = () => difficulty.enemyHp * difficulty.multiplier;
        const getDiffBossHp = () => difficulty.bossHp * difficulty.multiplier;
        const getDiffBossRate = () => difficulty.bossRate * difficulty.multiplier;

        const getEnemyHp = () => Math.max(1, Math.floor((1 + (currentLevel - 1) * 2) * getDiffEnemyHp()));
        const getSpecialHp = () => Math.max(1, Math.floor((2 + (currentLevel - 1) * 2) * getDiffEnemyHp()));

        // ===== 音频系统 (WebAudio, 无需外部文件) =====
        let audioCtx = null;
        let sfxVolume = 0.8, musicVolume = 0.5;
        let musicNodes = null;
        function ensureAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
                startMusic();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playTone(freq, duration, type = 'square', vol = 1, freqEnd = null) {
            if (!audioCtx || sfxVolume <= 0) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(vol * sfxVolume * 0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        const sfx = {
            shoot:   () => playTone(880, 0.07, 'square', 0.5, 440),
            explode: () => { playTone(150, 0.28, 'sawtooth', 0.9, 40); playTone(60, 0.35, 'triangle', 0.7, 30); },
            hurt:    () => playTone(130, 0.35, 'sawtooth', 1, 50),
            power:   () => { playTone(523, 0.1, 'sine', 0.8); setTimeout(() => playTone(784, 0.15, 'sine', 0.8), 80); },
            upgrade: () => { playTone(659, 0.1, 'sine', 0.8); setTimeout(() => playTone(880, 0.15, 'sine', 0.8), 90); }
        };
        function startMusic() {
            if (!audioCtx || musicNodes) return;
            const master = audioCtx.createGain();
            master.gain.value = musicVolume * 0.05;
            master.connect(audioCtx.destination);
            const notes = [110, 130.8, 146.8, 164.8]; // 太空氛围低音循环
            let idx = 0;
            const osc = audioCtx.createOscillator();
            osc.type = 'sine'; osc.frequency.value = notes[0];
            const lfo = audioCtx.createOscillator();
            lfo.frequency.value = 0.1;
            const lfoGain = audioCtx.createGain(); lfoGain.gain.value = 3;
            lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
            osc.connect(master); osc.start(); lfo.start();
            const interval = setInterval(() => {
                idx = (idx + 1) % notes.length;
                osc.frequency.setValueAtTime(notes[idx], audioCtx.currentTime);
            }, 2000);
            musicNodes = { master, osc, lfo, interval };
        }
        function setMusicVolume(v) {
            musicVolume = v;
            if (musicNodes) musicNodes.master.gain.value = v * 0.05;
        }

        // ===== 画质系统 (星空背景 + 爆炸粒子) =====
        const qualityCounts = { '低': { stars: 30, sparks: 60 }, '中': { stars: 80, sparks: 150 }, '高': { stars: 150, sparks: 300 } };
        let qualitySetting = '中';
        let stars = [], sparks = [];
        function initStars() {
            stars = [];

        }
        function spawnSparks(x, y, color, count) {
            const max = qualityCounts[qualitySetting].sparks;
            for (let i = 0; i < count; i++) {
                const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3;
                sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 20 + Math.random() * 20, color });
            }
            if (sparks.length > max) sparks.splice(0, sparks.length - max);
        }

        // 设置持久化
        const SETTINGS_KEY = 'ss_settings_v1';

        function loadSettings() {

            } catch(e) {}

        // ===== 按键自定义系统 =====

        let mouseBinds = { attack: 0, skill: 2 }; // 0=左键 1=中键 2=右键

        const DEFAULT_KEYBINDS = { left: 'a', right: 'd', attack: 'j', skill: 'k', pause: 'p' };
        const KEY_ACTION_NAMES = { left: '← 左移', right: '右移 →', attack: '攻击', skill: '技能', pause: '暂停' };

        // UI更新

        function saveGame() {

        function loadGame() {
            const saved = localStorage.getItem(saveKey());
            if (!saved) return false;
            try {
                const data = JSON.parse(saved);
                score = data.score || 0; hp = data.hp || 3; maxHp = data.maxHp || 3; gems = data.gems || 200;
                gameMode = data.gameMode || 'adventure'; currentLevel = data.currentLevel || 1;
                progress = data.progress || 0; killCount = data.killCount || 0;
                upgradeLevels = data.upgradeLevels || { bulletCount: 1, spread: 1, fireRate: 1, life: 1, activeShieldDuration: 1, activeShieldCooldown: 1, damage: 1 };
                tempUpgrades = data.tempUpgrades || { fireRate: 0, bulletCount: 0 };
