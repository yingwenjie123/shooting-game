                shieldRechargeTimer = data.shieldRechargeTimer || 0;
                activeShieldTime = data.activeShieldTime || 0; activeShieldCooldown = data.activeShieldCooldown || 0; itemShieldTime = data.itemShieldTime || 0;
                bossActive = data.bossActive || false; bossHP = data.bossHP || 0; bossMaxHP = data.bossMaxHP || 0;
                boss = data.boss || null; bossShootTimer = data.bossShootTimer || 0; bossMoveDirection = data.bossMoveDirection || 1;
                bossShieldTimer = data.bossShieldTimer || 0;
                bossSkillTriggers = data.bossSkillTriggers || { 80: false, 50: false, 20: false };
                gameTime = data.gameTime || 0; player.x = data.playerX || CW / 2;
                difficulty = data.difficulty || { spawnRate: 1.0, enemySpeed: 1.0, enemyHp: 1.0, bossHp: 1.0, bossRate: 1.0, bossThreshold: 50, multiplier: 1.0 };
                runKillCount = data.runKillCount || 0; runUpgradeNeed = data.runUpgradeNeed || 20;
                runPity = data.runPity || 0;
                runBonus = data.runBonus || { damage: 0, fireRate: 0, maxHp: 0 };
                bossSummonTimer = data.bossSummonTimer || 240;
                miniBossSpawned = data.miniBossSpawned || false;
                rushStarted = data.rushStarted || false; rushIndex = data.rushIndex || 0;
                hp = Math.min(hp, getMaxHp());
                // 兼容旧存档/上限调整：升级等级钳制到20级
                for (const k in upgradeLevels) upgradeLevels[k] = Math.min(upgradeLevels[k], 20);
                // 兼容旧存档：补齐Boss新字段
                if (boss) {
                    boss.moveSpeed = boss.moveSpeed || 2;
                    boss.skin = boss.skin || BOSS_SKINS[0];
                    boss.summonTimer = boss.summonTimer || 240;
                    boss.kind = boss.kind || 'small';
                    boss.summoned50 = boss.summoned50 || false;
                }

                bullets = []; enemies = []; smallEnemies = []; enemyBullets = []; specialEnemies = []; powerups = [];
                shootTimer = 0; enemySpawnTimer = 0; specialSpawnTimer = 120;
                gameOver = false; gameRunning = true; paused = false;
                
                // 重置触控位置
                touchTargetX = player.x + player.w/2;

                sliderSpawnRate.value = difficulty.spawnRate;
                sliderEnemySpeed.value = difficulty.enemySpeed;
                sliderEnemyHp.value = difficulty.enemyHp || 1.0;
                sliderBossHp.value = difficulty.bossHp;
                sliderBossRate.value = difficulty.bossRate;
                sliderBossThreshold.value = difficulty.bossThreshold;
                btnDoubleDifficulty.textContent = `当前: ${difficulty.multiplier.toFixed(1)}x`;
                updateDifficultyLabels();

                hideOverlays(); updateUI(); return true;
            } catch(e) { console.error('读档失败', e); return false; }
        }

        function clearSave() {
            localStorage.removeItem(saveKey());
            persistProfile(); // 局内进度没了，但水晶/升级等长期进度保留
            updateSaveSlotUI();
        }

        function resetGame(mode) {
            gameMode = mode || 'adventure';
            score = 0; hp = getMaxHp(); maxHp = getMaxHp();
            gameOver = false; gameRunning = true; paused = false;
            progress = 0; currentLevel = 1; killCount = 0;
            bossActive = false; bossHP = 0; bossMaxHP = 0; boss = null; bossShootTimer = 0;
            bossShieldTimer = 0;
            bossSkillTriggers = { 80: false, 50: false, 20: false };
            shieldCharges = 2; shieldRechargeTimer = 0;
            activeShieldTime = 0; activeShieldCooldown = 0; itemShieldTime = 0;
            bullets = []; enemies = []; smallEnemies = []; enemyBullets = []; specialEnemies = []; powerups = [];
            shootTimer = 0; enemySpawnTimer = 0; gameTime = 0; specialSpawnTimer = 120;
            player.x = CW / 2;
            touchTargetX = player.x + player.w/2;
            keys = { left: false, right: false, space: false };
            isTouching = false;
            tempUpgrades = { fireRate: 0, bulletCount: 0 };

            // 重置局内升级系统
            runKillCount = 0; runUpgradeNeed = 20; runUpgradePending = 0; runPity = 0;
            runBonus = { damage: 0, fireRate: 0, maxHp: 0 };
            playerAura = { time: 0, color: '#fff' };
            pendingVictoryGems = 0;
            bossSummonTimer = 0;
            miniBossSpawned = false; rushStarted = false; rushIndex = 0;
            continueAction = null; settleAction = null;
            player.speed = 6;
            deathContinueBtn.style.display = 'none';
            deathConfirmBtn.textContent = '✔ 确认返回菜单';

            updateUI(); clearSave();
        }

        // 生成陨石
        function spawnEnemy() {
            const x = Math.random() * (CW - ENEMY_WIDTH);
            let baseSpeed = gameMode === 'endless' ? 1.2 + currentLevel * 0.15 : 1.2 + (currentLevel - 1) * 0.2;
            baseSpeed *= getDiffSpeed();
            enemies.push({
                x, y: -ENEMY_HEIGHT, w: ENEMY_WIDTH, h: ENEMY_HEIGHT,
                speed: baseSpeed + Math.random() * 0.8,
                hp: getEnemyHp(), maxHp: getEnemyHp(),
                color: `hsl(${Math.floor(Math.random() * 20 + 350)}, 80%, 65%)`,
                seed: Math.random() * 10
            });
        }

        // 生成特殊小怪
        function spawnSpecialEnemy() {
            const x = Math.random() * (CW - ENEMY_WIDTH);
            const typeRoll = Math.random();
            let type = 1;
            if (typeRoll > 0.7) type = 3;
            else if (typeRoll > 0.4) type = 2;

            specialEnemies.push({
                x, y: -ENEMY_HEIGHT, w: ENEMY_WIDTH, h: ENEMY_HEIGHT,
                speed: (0.6 + Math.random() * 0.4) * getDiffSpeed(),
                shootTimer: 45, shootCooldown: Math.max(45, 100 - Math.min(currentLevel * 5, 55)),
                type: type, hp: getSpecialHp(), maxHp: getSpecialHp(),
                color: type === 1 ? '#d97706' : type === 2 ? '#8b5cf6' : '#ec4899'
            });
        }

        function shootBullet() {
            if (gameOver || !gameRunning || paused) return;
            sfx.shoot();
            const bulletCount = getBulletCount();
            const spreadCount = getSpreadCount();
            const baseX = player.x + player.w / 2 - BULLET_WIDTH / 2;
            const baseY = player.y - 8;
            for (let i = 0; i < bulletCount; i++) {
                const bulletY = baseY - i * 8;
                for (let j = 0; j < spreadCount; j++) {
                    let angle = 0;
                    if (spreadCount > 1) {
                        const t = (j / (spreadCount - 1)) * 2 - 1;
                        angle = t * 0.25;
                    }
                    const vx = Math.sin(angle) * BULLET_SPEED;
                    const vy = Math.cos(angle) * BULLET_SPEED;
                    bullets.push({
                        x: baseX, y: bulletY, w: BULLET_WIDTH, h: BULLET_HEIGHT,
                        speed: vy, vx: vx, 
                        baseSpeed: vy, baseVx: vx,
                        color: '#f0e86b', damage: getDamage()
                    });
                }
            }
        }

        // ===== 冒险模式关卡Boss体系 =====
        // kind: 'mini'小小Boss(普通关中段) / 'small'小Boss(每5关) / 'big'大Boss(第25关)
        function spawnLevelBoss(kind, lvl = currentLevel, isRush = false) {
            bossActive = true;
            let baseHp, sizeW = 120, sizeH = 80, skin;
            if (kind === 'mini') {
                baseHp = 80 + lvl * 40;
                sizeW = 72; sizeH = 50;
                const tierSkin = BOSS_SKINS[Math.floor(lvl / 5) % BOSS_SKINS.length];
                skin = { ...tierSkin, name: `小小Boss · ${tierSkin.name}的手下` };
            } else if (kind === 'small') {
                baseHp = 300 * Math.pow(2, (lvl / 5 - 1));
                skin = { ...BOSS_SKINS[(lvl / 5 - 1) % BOSS_SKINS.length], name: `小Boss · ${BOSS_SKINS[(lvl / 5 - 1) % BOSS_SKINS.length].name}` };
            } else { // big
                baseHp = 6000;
                sizeW = 170; sizeH = 110;
                skin = { name: '👑 大Boss · 终极主宰', body: '#e11d48', glow: '#fb7185', eye: '#fde047', pattern: 'crown' };
            }
            if (isRush) baseHp *= 0.6;
            bossMaxHP = Math.floor(baseHp * getDiffBossHp());
            bossHP = bossMaxHP;
            bossShootTimer = Math.max(8, (50 - lvl * 2) / getDiffBossRate());
            boss = {
                x: CW/2 - sizeW/2, y: 30, w: sizeW, h: sizeH, color: skin.body,
                skin, kind, isRush, rushLvl: lvl,
                moveSpeed: 2 + Math.min(lvl * 0.12, 2.5),
                summonTimer: 300, summoned50: false
            };
            bossSummonTimer = boss.summonTimer;
            bossMoveDirection = 1;
            bossShieldTimer = 0;
            bossSkillTriggers = { 80: false, 50: false, 20: false };
            spawnSparks(CW/2, 60, skin.glow, 30);
        }

        function spawnRushBoss() {
            const seq = RUSH_SEQUENCE[rushIndex];
            spawnLevelBoss(seq.kind, seq.lvl, true);
        }

        // 高一级Boss召唤低一级Boss作为小怪
        function summonLowerBossMinion() {
            if (!boss || !gameRunning || paused || gameOver) return;
            let kind, lvl;
            if (boss.kind === 'big') { kind = 'small'; lvl = 20; }
            else if (boss.kind === 'small') { kind = 'mini'; lvl = boss.isRush ? boss.rushLvl : currentLevel; }
            else return; // 小小Boss没有下级
            spawnBossMinionEnemy(kind, lvl);
        }

        function spawnBossMinionEnemy(kind, lvl) {
            let hpV, size, skin;
            if (kind === 'small') {
                hpV = 300 * Math.pow(2, (lvl / 5 - 1)) * 0.25;
                size = 56;
                skin = { ...BOSS_SKINS[(lvl / 5 - 1) % BOSS_SKINS.length] };
            } else {
                hpV = 80 + lvl * 20;
                size = 46;
                skin = { ...BOSS_SKINS[Math.floor(lvl / 5) % BOSS_SKINS.length] };
            }
            hpV = Math.max(10, Math.floor(hpV * getDiffBossHp()));
            enemies.push({
                x: Math.random() * (CW - size), y: -size, w: size, h: size,
                speed: 0.8, hp: hpV, maxHp: hpV,
                color: skin.body, bossMinion: true, skin, seed: Math.random() * 10
            });
            sfx.explode();
            spawnSparks(CW/2, 100, skin.glow, 25);
        }

        function rectCollide(r1, r2) {
            return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
        }

        // 生成Boss
        function spawnBoss() {
            bossActive = true;
            let baseHp;
            if (gameMode === 'endless') baseHp = 200 + (currentLevel - 1) * 400;
            else baseHp = 200 * Math.pow(2, currentLevel - 1);
            bossMaxHP = Math.floor(baseHp * getDiffBossHp());
            bossHP = bossMaxHP;
            bossShootTimer = Math.max(8, (50 - currentLevel * 6) / getDiffBossRate());
            boss = {
                x: CW/2 - 60, y: 30, w: 120, h: 80, color: '#a855f7',
                skin: BOSS_SKINS[(currentLevel - 1) % BOSS_SKINS.length],
                moveSpeed: 2 + Math.min(currentLevel * 0.15, 2.5), // 移速随关卡增强
                summonTimer: 240
            };
            bossSummonTimer = boss.summonTimer;
            bossMoveDirection = 1;
            bossShieldTimer = 0;
            bossSkillTriggers = { 80: false, 50: false, 20: false };
        }

        function getBossShootCooldown() {
            const hpPercent = bossHP / bossMaxHP;
            // 攻击频率提升：间隔缩短约 25%
            let baseCooldown = gameMode === 'endless' ? Math.max(6, 34 - currentLevel * 3) : Math.max(9, 40 - currentLevel * 5);
            const healthFactor = 1 - (1 - hpPercent) * 0.5;
            return Math.max(4, baseCooldown * healthFactor / getDiffBossRate());
        }

        function bossShoot() {
            if (!boss) return;
            const mode = Math.floor(Math.random() * 3);
            const centerX = boss.x + boss.w / 2;
            const centerY = boss.y + boss.h;

            // 索敌优化：弹幕始终朝向玩家所在的一侧释放
            const dx = player.x + player.w/2 - centerX;
            const dy = player.y + player.h/2 - centerY;
            const baseAngle = Math.atan2(dy, dx);
            const baseSpeed = 2.2 + currentLevel * 0.12;
            // 弹幕间距保障：相邻子弹角间距至少 0.26rad，
            // 在 300px 距离处空隙约 60px（子弹直径18px），飞机(36px宽)必定可穿越
            const ANGLE_STEP = 0.26;

            if (mode === 0) {
                // 朝玩家方向展开的扇形弹幕（间距按弹量自动扩展）
                const count = 5 + Math.min(currentLevel, 7);
                const spread = ANGLE_STEP * (count - 1) / 2;
                for (let i = 0; i < count; i++) {
                    const t = count === 1 ? 0 : (i / (count - 1)) * 2 - 1;
                    const angle = baseAngle + t * spread;
                    const vx = Math.cos(angle) * baseSpeed, vy = Math.sin(angle) * baseSpeed;
                    smallEnemies.push({ x: centerX, y: centerY, w: SMALL_SIZE, h: SMALL_SIZE, speed: vy, vx: vx, baseSpeed: vy, baseVx: vx, color: '#c084fc' });
                }
            } else if (mode === 1) {
                // 精准狙击弹
                const vx = (dx / Math.hypot(dx, dy)) * (2.5 + currentLevel * 0.1);
                const vy = (dy / Math.hypot(dx, dy)) * (2.5 + currentLevel * 0.1);
                smallEnemies.push({ x: centerX, y: centerY, w: SMALL_SIZE, h: SMALL_SIZE, speed: vy, vx: vx, baseSpeed: vy, baseVx: vx, color: '#f87171' });
            } else {
                // 双层交叉弹幕：统一角度网格（间距可穿越），两层只差速度不差角度，避免交错成墙
                const count = 6 + Math.min(currentLevel, 6);
                const spread = ANGLE_STEP * (count - 1) / 2;
                for (let i = 0; i < count; i++) {
                    const t = (i / (count - 1)) * 2 - 1;
                    const angle = baseAngle + t * spread;
                    const spd = i % 2 === 0 ? 2.0 : 2.6;
                    const vx = Math.cos(angle) * spd, vy = Math.sin(angle) * spd;
                    smallEnemies.push({ x: centerX, y: centerY, w: SMALL_SIZE, h: SMALL_SIZE, speed: vy, vx: vx, baseSpeed: vy, baseVx: vx, color: '#fbbf24' });
                }
            }
        }

        // Boss 召唤增强版小怪
        function summonEnhancedMinions() {
            if (!boss || !gameRunning || paused || gameOver) return;
            const n = 2 + Math.floor(Math.random() * 2);
            for (let i = 0; i < n; i++) {
                const x = Math.max(0, Math.min(CW - ENEMY_WIDTH, boss.x + (Math.random() - 0.5) * boss.w * 2));
                const hpV = Math.max(2, getEnemyHp() * 2);
                enemies.push({
                    x, y: boss.y + boss.h, w: ENEMY_WIDTH, h: ENEMY_HEIGHT,
                    speed: 2.0 + Math.random() * 0.6 + currentLevel * 0.05,
                    hp: hpV, maxHp: hpV,
                    color: '#ff00cc', enhanced: true, seed: Math.random() * 10
                });
            }
            sfx.explode();
            spawnSparks(boss.x + boss.w/2, boss.y + boss.h, '#ff00cc', 25);
        }

        function bossSkillBurst() {
            if (!boss) return;
            const centerX = boss.x + boss.w / 2;
            const centerY = boss.y + boss.h / 2;
            // 全周爆发：限制数量保证相邻子弹角间距 ≥ 0.26rad（飞机可穿越）
            const count = Math.min(24, 16 + currentLevel * 2);
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i + Math.random() * 0.1;
                const speed = 1.5 + Math.random() * 1.5;
                const vx = Math.cos(angle) * speed, vy = Math.sin(angle) * speed;
                smallEnemies.push({ x: centerX, y: centerY, w: SMALL_SIZE, h: SMALL_SIZE, speed: vy, vx: vx, baseSpeed: vy, baseVx: vx, color: '#ff00cc' });
            }
            for (let i = 0; i < 3; i++) {
                const dx = player.x + player.w/2 - centerX + (Math.random()-0.5)*120;
                const dy = player.y + player.h/2 - centerY + (Math.random()-0.5)*120;
                const len = Math.hypot(dx, dy);
                const vx = (dx/len) * 4, vy = (dy/len) * 4;
                smallEnemies.push({ x: centerX, y: centerY, w: SMALL_SIZE, h: SMALL_SIZE, speed: vy, vx: vx, baseSpeed: vy, baseVx: vx, color: '#ff0000' });
            }
        }

        function spawnPowerup(x, y) {
            const types = ['fireRate', 'bulletCount', 'shield', 'life'];
            const type = types[Math.floor(Math.random() * types.length)];
            powerups.push({
                x, y, w: 20, h: 20, type: type, speed: 1.5,
                color: type === 'fireRate' ? '#3b82f6' : type === 'bulletCount' ? '#f59e0b' : type === 'shield' ? '#06b6d4' : '#ef4444',
                symbol: type === 'fireRate' ? '⚡' : type === 'bulletCount' ? '🎯' : type === 'shield' ? '🛡️' : '❤️'
            });
        }

        function damagePlayer() {
            if (activeShieldTime > 0 || itemShieldTime > 0) return;
            hp = Math.max(0, hp - 1);
            spawnSparks(player.x + player.w/2, player.y + player.h/2, '#ff5e6b', 15);
            if (hp <= 0) {
                gameOver = true; gameRunning = false;
                const earned = Math.floor(score / 80);
                gems += earned;
                sfx.explode();
                clearSave(); showDeathOverlay('💀 你已坠机', earned);
            } else {
                sfx.hurt();
            }
            updateUI();
        }

        function applyPowerup(type) {
            if (type === 'fireRate') tempUpgrades.fireRate++;
            else if (type === 'bulletCount') tempUpgrades.bulletCount++;
            else if (type === 'shield') {
                if (shieldCharges < MAX_SHIELD_CHARGES) {
                    shieldCharges++;
                    if (shieldCharges === MAX_SHIELD_CHARGES) shieldRechargeTimer = 0;
                }
            }
            else if (type === 'life') hp = Math.min(getMaxHp(), hp + 1);
            sfx.power();
            updateUI();
        }

        function applySlowdownToBullet(b) {
            const dx = (b.x + b.w/2) - (player.x + player.w/2);
            const dy = (b.y + b.h/2) - (player.y + player.h/2);
            const dist = Math.hypot(dx, dy);
            let ratio = 1.0;
            if (dist < 200) ratio = Math.max(0.5, dist / 200);
            b.speed = b.baseSpeed * ratio;
            b.vx = b.baseVx * ratio;
        }

        // 核心更新
        function update() {
            if (gameOver || !gameRunning || paused) return;
            gameTime++;

            if (activeShieldTime > 0) activeShieldTime--;
            if (itemShieldTime > 0) itemShieldTime--;
            if (playerAura.time > 0) playerAura.time--;
            
            if (shieldCharges < MAX_SHIELD_CHARGES) {
                shieldRechargeTimer++;
                const rechargeTime = 900;
                if (shieldRechargeTimer >= rechargeTime) {
                    shieldCharges++;
                    shieldRechargeTimer = 0;
                    updateUI();
                }
            } else {
                shieldRechargeTimer = 0;
            }
            
            if (activeShieldCooldown > 0) {
                activeShieldCooldown--;
                if (activeShieldCooldown === 0) updateUI();
            }

            if (bossShieldTimer > 0) bossShieldTimer--;

            // 触控或键盘移动（鼠标方案：鼠标移动后短期内平滑跟随光标）
            if (isTouching || gameTime - lastMouseMoveFrame < 25) {
                const dx = touchTargetX - (player.x + player.w/2);
                player.x += dx * 0.4; // 平滑跟随手指/鼠标
            } else {
                if (keys.left) player.x = Math.max(0, player.x - player.speed);
                if (keys.right) player.x = Math.min(CW - player.w, player.x + player.speed);
            }

            // 射击 (按住屏幕或空格)
            if (shootTimer > 0) shootTimer--;
            if ((keys.space || isTouching) && shootTimer <= 0) {
                shootBullet();
                shootTimer = getFireCooldown();
            }

            // 边界限制
            player.x = Math.max(0, Math.min(CW - player.w, player.x));

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx || 0; b.y += b.speed;
                if (b.y + b.h < 0 || b.y > CH || b.x < -50 || b.x > CW + 50) bullets.splice(i, 1);
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += e.speed;
                if (e.y > CH + 30) enemies.splice(i, 1);
            }

            for (let i = specialEnemies.length - 1; i >= 0; i--) {
                const s = specialEnemies[i];
                s.y += s.speed;
                if (s.y > CH + 30) { specialEnemies.splice(i, 1); continue; }

                s.shootTimer--;
                if (s.shootTimer <= 0) {
                    const dx = player.x + player.w/2 - (s.x + s.w/2);
                    const dy = player.y + player.h/2 - (s.y + s.h/2);
                    const baseAngle = Math.atan2(dy, dx);
                    
                    if (s.type === 1) {
                        const len = Math.hypot(dx, dy);
                        const vx = (dx/len) * 2.5, vy = (dy/len) * 2.5;
                        enemyBullets.push({ x: s.x + s.w/2, y: s.y + s.h, w: 6, h: 6, speed: vy, vx: vx, baseSpeed: vy, baseVx: vx, color: '#f87171' });
                    } else if (s.type === 2) {
                        for (let offset = -0.2; offset <= 0.2; offset += 0.4) {
                            const angle = baseAngle + offset;
                            const vx = Math.cos(angle) * 2.5, vy = Math.sin(angle) * 2.5;
                            enemyBullets.push({ x: s.x + s.w/2, y: s.y + s.h, w: 6, h: 6, speed: vy, vx: vx, baseSpeed: vy, baseVx: vx, color: '#f87171' });
                        }
                    } else if (s.type === 3) {
                        for (let offset = -0.3; offset <= 0.3; offset += 0.3) {
                            const angle = baseAngle + offset;
                            const vx = Math.cos(angle) * 2.5, vy = Math.sin(angle) * 2.5;
                            enemyBullets.push({ x: s.x + s.w/2, y: s.y + s.h, w: 6, h: 6, speed: vy, vx: vx, baseSpeed: vy, baseVx: vx, color: '#f87171' });
                        }
                    }
                    s.shootTimer = s.shootCooldown;
                }
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const eb = enemyBullets[i];
                applySlowdownToBullet(eb);
                eb.x += eb.vx; eb.y += eb.speed;
                if (eb.y > CH + 20 || eb.y < -20 || eb.x < -20 || eb.x > CW + 20) enemyBullets.splice(i, 1);
            }

            for (let i = smallEnemies.length - 1; i >= 0; i--) {
                const s = smallEnemies[i];
                applySlowdownToBullet(s);
                s.x += s.vx; s.y += s.speed;
                if (s.y > CH + 30 || s.x < -30 || s.x > CW + 30) smallEnemies.splice(i, 1);
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.y += p.speed;
                if (p.y > CH + 30) powerups.splice(i, 1);
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                let used = false;
                
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (rectCollide(bullet, enemies[j])) {
                        enemies[j].hp -= bullet.damage;
                        used = true;
                        if (enemies[j].hp <= 0) {
                            const killed = enemies[j];
                            enemies.splice(j, 1);
                            score += killed.bossMinion ? 100 : 10;
                            gems += killed.bossMinion ? 10 : 1;
                            runKillCount += killed.bossMinion ? 5 : 1;
                            if (!bossActive) { killCount += killed.bossMinion ? 5 : 1; progress = Math.min(100, (killCount / difficulty.bossThreshold) * 100); }
                            sfx.explode();
                            spawnSparks(bullet.x, bullet.y, killed.bossMinion ? '#ff9d5c' : '#ffd966', killed.bossMinion ? 30 : 12);
                        }
                    requestUI();
                    break;
                    }
                }
                if (used) { bullets.splice(i, 1); continue; }

                for (let j = specialEnemies.length - 1; j >= 0; j--) {
                    if (rectCollide(bullet, specialEnemies[j])) {
                        specialEnemies[j].hp -= bullet.damage;
                        used = true;
                        if (specialEnemies[j].hp <= 0) {
                            specialEnemies.splice(j, 1); score += 20; gems += 2;
                            runKillCount += 2;
                            if (!bossActive) { killCount += 2; progress = Math.min(100, (killCount / difficulty.bossThreshold) * 100); }
                            sfx.explode();
                            spawnSparks(bullet.x, bullet.y, '#f87171', 20);
                            spawnPowerup(bullet.x, bullet.y);
                        }
                        requestUI();
                        break;
                    }
                }
                if (used) { bullets.splice(i, 1); continue; }

                if (bossActive && boss && bossShieldTimer <= 0 && rectCollide(bullet, boss)) {
                    bossHP -= bullet.damage; score += 5;
                    const hpPercent = (bossHP / bossMaxHP) * 100;
                    if (hpPercent <= 80 && !bossSkillTriggers[80]) { bossSkillTriggers[80] = true; bossSkillBurst(); }
                    if (hpPercent <= 50 && !bossSkillTriggers[50]) { bossSkillTriggers[50] = true; bossSkillBurst(); }
                    // 小Boss/大Boss血量过半：召唤下一级Boss作为小怪
                    if (hpPercent <= 50 && boss.kind !== 'mini' && !boss.summoned50) {
                        boss.summoned50 = true;
                        summonLowerBossMinion();
                    }
                    if (hpPercent <= 20 && !bossSkillTriggers[20]) { 
                        bossSkillTriggers[20] = true; 
                        bossSkillBurst(); 
                        bossShieldTimer = 120;
                    }
                    
                    if (bossHP <= 0) {
                        bossActive = false; boss = null;
                        score += 200; gems += 30; progress = 0; killCount = 0;
                        runKillCount += 10;
                        sfx.explode();
                        spawnSparks(CW/2, CH/2, '#ff9d5c', 40);
                        spawnPowerup(CW/2, CH/2);
                        if (gameMode === 'adventure') {
                            handleAdventureBossKilled();
                        } else {
                            // 无限模式：沿用原冒险模板，每5关可选择继续挑战
                            currentLevel++;
                            if (currentLevel > 5 && (currentLevel - 1) % 5 === 0) {
                                pendingVictoryGems = 100;
                                showVictoryChoice();
                            }
                        }
                    }
                    requestUI(); bullets.splice(i, 1); continue;
                }
            }

            // 碰撞检测：一旦本帧内弹出结算/升级界面(paused)或死亡，立即停止后续判定，
            // 避免"Boss死亡弹结算"与"玩家被击中"在同一帧互相覆盖
            for (let i = enemies.length - 1; i >= 0; i--) {
                if (paused || gameOver) break;
                if (rectCollide(player, enemies[i])) { enemies.splice(i, 1); damagePlayer(); }
            }
            for (let i = specialEnemies.length - 1; i >= 0; i--) {
                if (paused || gameOver) break;
                if (rectCollide(player, specialEnemies[i])) { specialEnemies.splice(i, 1); damagePlayer(); }
            }
            for (let i = smallEnemies.length - 1; i >= 0; i--) {
                if (paused || gameOver) break;
                if (rectCollide(player, smallEnemies[i])) { smallEnemies.splice(i, 1); damagePlayer(); }
            }
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                if (paused || gameOver) break;
                if (rectCollide(player, enemyBullets[i])) { enemyBullets.splice(i, 1); damagePlayer(); }
            }
            if (!paused && !gameOver && bossActive && boss && bossShieldTimer <= 0 && rectCollide(player, boss)) {
                damagePlayer(); player.x = Math.max(0, Math.min(CW - player.w, player.x - 30));
            }

            if (gameOver) return; // 死亡后提前退出本帧，避免继续碰撞检测

            for (let i = powerups.length - 1; i >= 0; i--) {
                if (paused || gameOver) break;
                if (rectCollide(player, powerups[i])) {
                    applyPowerup(powerups[i].type);
                    powerups.splice(i, 1);
                }
            }

            // 局内升级检测：击坠数达到需求即弹出强化选择 (结算/确认界面打开时不触发)
            if (!gameOver && runKillCount >= runUpgradeNeed
                && deathOverlay.classList.contains('hidden')
                && confirmOverlay.classList.contains('hidden')) {
                runUpgradePending++;
                runUpgradeNeed += 10;
                showRunUpgrade();
            }

            if (bossActive && boss) {
                boss.x += bossMoveDirection * boss.moveSpeed;
                if (boss.x <= 20 || boss.x + boss.w >= CW - 20) bossMoveDirection *= -1;

                bossShootTimer--;
                if (bossShootTimer <= 0 && bossShieldTimer <= 0) {
                    bossShoot();
                    bossShootTimer = getBossShootCooldown();
                }

                // Boss 定期召唤（连战Boss召唤下级Boss，普通Boss召唤增强小怪）
                bossSummonTimer--;
                if (bossSummonTimer <= 0) {
                    if (boss.isRush) {
                        summonLowerBossMinion();
                        bossSummonTimer = 420;
                    } else {
                        summonEnhancedMinions();
                        bossSummonTimer = Math.max(180, 360 - currentLevel * 12);
                    }
                }
            }

            if (gameMode === 'adventure') {
                // 冒险模式：按关卡类型生成Boss
                if (!bossActive) {
                    const type = getLevelType(currentLevel);
                    if (type === 'rush') {
                        if (!rushStarted) { rushStarted = true; rushIndex = 0; spawnRushBoss(); }
                    } else if (type === 'normal') {
                        // 普通关中段出现小小Boss，击杀后过关
                        if (!miniBossSpawned && killCount >= Math.ceil(difficulty.bossThreshold / 2)) {
                            miniBossSpawned = true;
                            spawnLevelBoss('mini');
                        }
                    } else if (killCount >= difficulty.bossThreshold) {
                        spawnLevelBoss(type === 'big' ? 'big' : 'small');
                        killCount = 0; progress = 0;
                    }
                }
            } else if (!bossActive && killCount >= difficulty.bossThreshold) {
                spawnBoss();
                killCount = 0;
                progress = 0;
            }

            if (!gameOver && !paused) {
                const baseDelay = gameMode === 'endless' ? Math.max(8, 35 - currentLevel * 3) : Math.max(10, 40 - currentLevel * 4);
                if (enemySpawnTimer <= 0) {
                    spawnEnemy();
                    if (gameTime > 600 && Math.random() < 0.3) spawnEnemy();
                    enemySpawnTimer = Math.max(2, baseDelay / getDiffSpawn());
                } else {
                    enemySpawnTimer--;
                }

                specialSpawnTimer--;
                if (specialSpawnTimer <= 0) {
                    spawnSpecialEnemy();
                    specialSpawnTimer = Math.max(30, 180 - currentLevel * 10);
                }
            }
        }

        // ===== 玩家机甲皮肤 =====
        function drawPlayerShip() {
            const px = player.x, py = player.y, w = player.w, h = player.h;
            const cx = px + w / 2;
            ctx.save();
            // 引擎尾焰 (动态抖动)
            const flame = 6 + Math.random() * 6;
            ctx.shadowColor = '#ffb347'; ctx.shadowBlur = 14;
            ctx.fillStyle = '#ffb347';
            ctx.beginPath();
            ctx.moveTo(cx - 5, py + h); ctx.lineTo(cx + 5, py + h); ctx.lineTo(cx, py + h + flame);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#fff3c4';
            ctx.beginPath();
            ctx.moveTo(cx - 2.5, py + h); ctx.lineTo(cx + 2.5, py + h); ctx.lineTo(cx, py + h + flame * 0.5);
            ctx.closePath(); ctx.fill();
            // 主机身
            ctx.shadowColor = '#7ae0ff'; ctx.shadowBlur = 18;
            ctx.fillStyle = '#2e6b8f';
            ctx.beginPath();
            ctx.moveTo(cx, py - 2);
            ctx.lineTo(px + w * 0.72, py + h * 0.55);
            ctx.lineTo(px + w, py + h);
            ctx.lineTo(px + w * 0.55, py + h * 0.85);
            ctx.lineTo(cx, py + h * 0.75);
            ctx.lineTo(px + w * 0.45, py + h * 0.85);
            ctx.lineTo(px, py + h);
            ctx.lineTo(px + w * 0.28, py + h * 0.55);
            ctx.closePath(); ctx.fill();
            // 机身高光条
            ctx.shadowBlur = 4; ctx.fillStyle = 'rgba(174,241,255,0.35)';
            ctx.beginPath();
            ctx.moveTo(cx, py); ctx.lineTo(cx + 3, py + h * 0.7); ctx.lineTo(cx - 3, py + h * 0.7);
            ctx.closePath(); ctx.fill();
            // 座舱
            ctx.shadowBlur = 8; ctx.fillStyle = '#aef1ff';
            ctx.beginPath(); ctx.ellipse(cx, py + h * 0.42, 4.5, 7, 0, 0, Math.PI * 2); ctx.fill();
            // 翼尖炮
            ctx.fillStyle = '#f0e86b'; ctx.shadowColor = '#f0e86b';
            ctx.fillRect(px + w * 0.1, py + h * 0.5, 3, 7);
            ctx.fillRect(px + w * 0.85, py + h * 0.5, 3, 7);
            ctx.restore();
        }

        // 绘制
        function draw() {
            ctx.clearRect(0, 0, CW, CH);
            ctx.fillStyle = '#0b1119'; ctx.fillRect(0, 0, CW, CH);

            // 星空背景 (数量随画质设置)
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            for (const st of stars) {
                st.y += st.sp;
                if (st.y > CH) { st.y = -2; st.x = Math.random() * CW; }
                ctx.fillRect(st.x, st.y, st.r, st.r);
            }

            // 爆炸粒子
            for (let i = sparks.length - 1; i >= 0; i--) {
                const s = sparks[i];
                s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.life--;
                if (s.life <= 0) { sparks.splice(i, 1); continue; }
                ctx.globalAlpha = Math.min(1, s.life / 20);
                ctx.fillStyle = s.color;
                ctx.fillRect(s.x, s.y, 3, 3);
            }
            ctx.globalAlpha = 1;

            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            for (let i = 0; i < 100; i++) {
                if (i % 2 === 0) continue;
                ctx.beginPath(); ctx.arc((i*37)%CW, (i*71)%CH, (i%3)*0.7+0.5, 0, Math.PI*2); ctx.fill();
            }

            // 升级特效光环：颜色随强化方向变化，范围随时间扩大
            if (playerAura.time > 0) {
                ctx.save();
                ctx.globalAlpha = Math.min(1, playerAura.time / 50);
                ctx.shadowColor = playerAura.color; ctx.shadowBlur = 25;
                ctx.strokeStyle = playerAura.color; ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(player.x + player.w/2, player.y + player.h/2, 26 + (90 - playerAura.time) * 0.35, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            if (activeShieldTime > 0) {
                ctx.shadowColor = '#eab308'; ctx.shadowBlur = 40;
                ctx.strokeStyle = '#facc15'; ctx.lineWidth = 5;
                ctx.beginPath(); ctx.arc(player.x + player.w/2, player.y + player.h/2, 35, 0, Math.PI*2); ctx.stroke();
            } else if (itemShieldTime > 0) {
                ctx.shadowColor = '#66d9ff'; ctx.shadowBlur = 25;
                ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(player.x + player.w/2, player.y + player.h/2, 30, 0, Math.PI*2); ctx.stroke();
            }
            
            drawPlayerShip();

            ctx.shadowColor = '#f0e86b'; ctx.shadowBlur = 12;
            for (const b of bullets) {
                ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.fillStyle = '#fff9c4'; ctx.fillRect(b.x + 1, b.y + 2, b.w - 2, b.h - 6);
            }

            ctx.shadowColor = '#f87171'; ctx.shadowBlur = 10;
            for (const eb of enemyBullets) {
                ctx.fillStyle = eb.color;
                ctx.beginPath(); ctx.arc(eb.x, eb.y, 4, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(eb.x, eb.y, 2, 0, Math.PI*2); ctx.fill();
            }

            // 普通小怪：陨石皮肤（不规则岩石 + 陨石坑），增强版为紫红尖刺体
            // Boss手下：缩小版Boss外形
            for (const e of enemies) {
                ctx.save();
                const cx0 = e.x + e.w/2, cy0 = e.y + e.h/2;
                if (e.bossMinion) {
                    const sk = e.skin || BOSS_SKINS[0];
                    ctx.shadowColor = sk.glow; ctx.shadowBlur = 20;
                    ctx.fillStyle = sk.body;
                    ctx.beginPath(); ctx.ellipse(cx0, cy0, e.w/2, e.h/2, 0, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 6; ctx.fillStyle = sk.eye;
                    ctx.beginPath();
                    ctx.arc(cx0 - e.w*0.15, cy0 - e.h*0.1, e.w*0.09, 0, Math.PI*2);
                    ctx.arc(cx0 + e.w*0.15, cy0 - e.h*0.1, e.w*0.09, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(cx0 - e.w*0.17, cy0 - e.h*0.12, e.w*0.03, 0, Math.PI*2);
                    ctx.arc(cx0 + e.w*0.13, cy0 - e.h*0.12, e.w*0.03, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.shadowColor = e.enhanced ? '#ff00cc' : '#ff4d4d'; ctx.shadowBlur = 18;
                    ctx.fillStyle = e.color;
                    ctx.beginPath();
                    const nPts = 7;
                    for (let i = 0; i < nPts; i++) {
                        const a = (Math.PI * 2 / nPts) * i;
                        const r = e.w/2 * (e.enhanced ? 0.7 + 0.3 * Math.sin(i * 2.4 + (e.seed || 0)) : 0.85 + 0.15 * Math.sin((e.seed || 0) * 7 + i * 3));
                        const vx = cx0 + Math.cos(a) * r, vy = cy0 + Math.sin(a) * r;
                        if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
                    }
                    ctx.closePath(); ctx.fill();
                    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(0,0,0,0.35)';
                    ctx.beginPath(); ctx.arc(cx0 - e.w*0.15, cy0 - e.h*0.12, e.w*0.14, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx0 + e.w*0.2, cy0 + e.h*0.15, e.w*0.1, 0, Math.PI*2); ctx.fill();
                    // 独眼
                    ctx.fillStyle = e.enhanced ? '#fff' : '#ffd9d9';
                    ctx.beginPath(); ctx.arc(cx0, cy0 - e.h*0.05, e.w*0.12, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#1a0a0a';
                    ctx.beginPath(); ctx.arc(cx0, cy0 - e.h*0.05, e.w*0.055, 0, Math.PI*2); ctx.fill();
                }
                if (e.hp < e.maxHp) {
                    ctx.font = '10px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                    ctx.fillStyle = '#fff'; ctx.fillText(`${Math.ceil(e.hp)}/${e.maxHp}`, e.x + e.w/2, e.y - 2);
                }
                ctx.restore();
            }

            // 特殊小怪：UFO 飞碟皮肤
            for (const s of specialEnemies) {
                ctx.save();
                const cx0 = s.x + s.w/2, cy0 = s.y + s.h/2;
                ctx.shadowColor = s.color; ctx.shadowBlur = 20;
                // 穹顶
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.beginPath(); ctx.arc(cx0, cy0 - 2, s.w/3.6, Math.PI, 0); ctx.fill();
                // 碟身
                ctx.fillStyle = s.color;
                ctx.beginPath(); ctx.ellipse(cx0, cy0 + 3, s.w/2, s.h/3.2, 0, 0, Math.PI*2); ctx.fill();
                // 底部灯组
                ctx.shadowBlur = 5; ctx.fillStyle = '#fbbf24';
                for (let i = -1; i <= 1; i++) {
                    ctx.beginPath(); ctx.arc(cx0 + i * s.w/4, cy0 + s.h/4, 2.5, 0, Math.PI*2); ctx.fill();
                }
                if (s.hp < s.maxHp) {
                    ctx.font = '10px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                    ctx.fillStyle = '#fff'; ctx.fillText(`${Math.ceil(s.hp)}/${s.maxHp}`, s.x + s.w/2, s.y - 2);
                }
                ctx.restore();
            }

            // Boss弹幕小怪：发光圆珠 + 白色内核
            for (const s of smallEnemies) {
                ctx.save();
                const cx0 = s.x + s.w/2, cy0 = s.y + s.h/2;
                ctx.shadowColor = s.color; ctx.shadowBlur = 12;
                ctx.fillStyle = s.color;
                ctx.beginPath(); ctx.arc(cx0, cy0, s.w/2, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0; ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(cx0, cy0, s.w/4, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }

            for (const p of powerups) {
                ctx.shadowColor = p.color; ctx.shadowBlur = 15;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x + p.w/2, p.y + p.h/2, p.w/2, 0, Math.PI*2); ctx.fill();
                ctx.font = '14px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fff'; ctx.fillText(p.symbol, p.x + p.w/2, p.y + p.h/2);
            }

            if (bossActive && boss) {
                const skin = boss.skin || BOSS_SKINS[0];
                if (bossShieldTimer > 0) {
                    ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 40;
                    ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.arc(boss.x + boss.w/2, boss.y + boss.h/2, boss.w/1.5, 0, Math.PI*2); ctx.stroke();
                }

                ctx.save();
                const bx = boss.x, by = boss.y, bw = boss.w, bh = boss.h;
                const bcx = bx + bw/2, bcy = by + bh/2;
                ctx.shadowColor = skin.glow; ctx.shadowBlur = 25;
                // 头部装饰 (不同关卡的皮肤造型)
                ctx.fillStyle = skin.glow;
                if (skin.pattern === 'horns') {
                    ctx.beginPath();
                    ctx.moveTo(bx + bw*0.12, by + bh*0.25); ctx.lineTo(bx + bw*0.02, by - 12); ctx.lineTo(bx + bw*0.3, by + bh*0.1);
                    ctx.closePath(); ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(bx + bw*0.88, by + bh*0.25); ctx.lineTo(bx + bw*0.98, by - 12); ctx.lineTo(bx + bw*0.7, by + bh*0.1);
                    ctx.closePath(); ctx.fill();
                } else if (skin.pattern === 'crown') {
                    ctx.beginPath();
                    for (let i = 0; i <= 4; i++) {
                        const vx = bx + bw*0.2 + bw*0.15*i;
                        const vy = (i % 2 === 0) ? by - 14 : by + 2;
                        i === 0 ? ctx.moveTo(vx, vy) : ctx.lineTo(vx, vy);
                    }
                    ctx.lineTo(bx + bw*0.8, by + bh*0.12); ctx.lineTo(bx + bw*0.2, by + bh*0.12);
                    ctx.closePath(); ctx.fill();
                } else if (skin.pattern === 'spikes') {
                    for (let i = 0; i < 5; i++) {
                        const vx = bx + bw*0.15 + bw*0.175*i;
                        ctx.beginPath();
                        ctx.moveTo(vx - 8, by + bh*0.15); ctx.lineTo(vx, by - 16); ctx.lineTo(vx + 8, by + bh*0.15);
                        ctx.closePath(); ctx.fill();
                    }
                } else if (skin.pattern === 'halo') {
                    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.ellipse(bcx, by - 16, bw*0.3, 8, 0, 0, Math.PI*2); ctx.stroke();
                }
                // 主体
                ctx.shadowColor = skin.glow; ctx.shadowBlur = 25;
                ctx.fillStyle = skin.body;
                ctx.beginPath(); ctx.ellipse(bcx, bcy, bw/2, bh/2, 0, 0, Math.PI*2); ctx.fill();
                // 装甲缝线
                ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.ellipse(bcx, bcy, bw/2.6, bh/2.8, 0, 0, Math.PI*2); ctx.stroke();
                // 眼睛
                ctx.shadowBlur = 10; ctx.fillStyle = skin.eye;
                if (skin.pattern === 'eye') {
                    // 深渊之眼：单只巨眼
                    ctx.beginPath(); ctx.ellipse(bcx, bcy - bh*0.08, bw*0.16, bh*0.16, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#111';
                    ctx.beginPath(); ctx.arc(bcx, bcy - bh*0.08, bw*0.06, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(bcx - bw*0.03, bcy - bh*0.12, 4, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(bx + bw*0.35, by + bh*0.4, 8, 0, Math.PI*2);
                    ctx.arc(bx + bw*0.65, by + bh*0.4, 8, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(bx + bw*0.33, by + bh*0.38, 3, 0, Math.PI*2);
                    ctx.arc(bx + bw*0.63, by + bh*0.38, 3, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
                // 血条 + 皮肤名称
                ctx.shadowBlur = 0; ctx.fillStyle = '#330000';
                ctx.fillRect(bx, by - 15, bw, 8);
                ctx.fillStyle = '#ff3b3b';

        // ===== 局内升级系统 =====
        const RUN_ASPECTS = [
            { key: 'damage',  name: '⚔️ 火力强化', color: '#ef4444',
              desc: (v) => `子弹伤害 +${v}`,
              apply: (v) => { runBonus.damage += v; } },

              desc: (v) => `生命上限 +${Math.max(1, Math.round(v))} 并回满`,
              apply: (v) => { const n = Math.max(1, Math.round(v)); runBonus.maxHp += n; hp = getMaxHp(); } },
        ];
        const RARITIES = [
            { key: 'white',  name: '普 通', color: '#e5e7eb', value: 0.5 },
            { key: 'blue',   name: '稀 有', color: '#3b82f6', value: 1 },
            { key: 'purple', name: '史 诗', color: '#a855f7', value: 1.5 },
            { key: 'orange', name: '传 说', color: '#f59e0b', value: 4 },
        ];
        // 基础概率 白0.2 / 蓝0.6 / 紫0.15 / 橙0.05，保底：每次升级后紫橙概率+0.1
        function rollRarity() {
            const pity = Math.min(runPity, 0.5);
            const wRaw = Math.max(0.02, 0.2 - pity * 0.5);
            const bRaw = Math.max(0.05, 0.6 - pity * 0.5);
            const pRaw = 0.15 + pity;
            const oRaw = 0.05 + pity;
            const sum = wRaw + bRaw + pRaw + oRaw;
            let r = Math.random() * sum;
            const entries = [['white', wRaw], ['blue', bRaw], ['purple', pRaw], ['orange', oRaw]];
            for (const [key, weight] of entries) {
                if (r < weight) return key;
                r -= weight;
            }
            return 'blue';
        }
        function showRunUpgrade() {
            paused = true;
            hideOverlays();
            levelUpOptions.innerHTML = '';
            // 两个选项的强化方面不重复：洗牌取前两个
            const pool = [...RUN_ASPECTS].sort(() => Math.random() - 0.5);
            for (let i = 0; i < 2; i++) {
                const aspect = pool[i];
                const rarity = RARITIES.find(r => r.key === rollRarity());
                const card = document.createElement('div');
                card.className = 'levelup-card';
                card.style.borderColor = rarity.color;
                card.style.boxShadow = `0 0 16px ${rarity.color}66`;
                card.innerHTML = `<div class="r-name" style="color:${rarity.color};">${rarity.name}</div>
                                  <div class="a-name">${aspect.name}</div>
                                  <div class="a-desc">${aspect.desc(rarity.value)}</div>`;
                card.addEventListener('click', () => applyRunUpgrade(aspect, rarity));
                levelUpOptions.appendChild(card);
            }
            levelUpPity.textContent = runPity > 0
                ? `🛡️ 保底机制：史诗/传说出现率已提升 +${Math.round(Math.min(runPity, 0.5) * 100)}%`
                : '';
            levelUpOverlay.classList.remove('hidden');
        }
        function applyRunUpgrade(aspect, rarity) {
            if (levelUpOverlay.classList.contains('hidden')) return; // 防连点重复生效
            levelUpOverlay.classList.add('hidden');
            try {
                aspect.apply(rarity.value);
                player.speed += 0.1; // 每次升级移速 +0.1
                // 升级特效：机身光环按强化方向变色 + 粒子按稀有度颜色迸发
                playerAura = { time: 90, color: aspect.color };
                spawnSparks(player.x + player.w/2, player.y + player.h/2, rarity.color, 25);
                if (rarity.key === 'purple' || rarity.key === 'orange') {
                    runPity = 0; // 抽到紫/橙重置保底
                    sfx.upgrade();
                } else {
                    runPity += 0.1;
                    sfx.power();
                }
            } finally {
                // 无论升级过程是否出错，都必须恢复运行状态，避免暂停软锁
                runUpgradePending--;
                if (runUpgradePending > 0) {
                    showRunUpgrade();
                } else {
                    levelUpOverlay.classList.add('hidden');
                    paused = false;
                    updateUI();
                }
            }
        }

        // 坐标转换：将屏幕触摸点映射到 Canvas 内部坐标
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const scaleX = CW / rect.width;
            const scaleY = CH / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function initEvents() {
            // 键盘事件 (支持电脑端，按键可在设置中自定义)
            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                // 改键监听状态：捕获下一个按键
                if (rebindingAction) {
                    e.preventDefault();
                    if (key !== 'escape') { keyBinds[rebindingAction] = key; saveKeybinds(); }
                    rebindingAction = null;
                    renderKeybindUI();
                    return;
                }
                if (key === keyBinds.pause || key === 'escape') {
                    e.preventDefault();
                    // 局内升级/结算界面打开时不允许用暂停键解除暂停
                    if (!levelUpOverlay.classList.contains('hidden') || !deathOverlay.classList.contains('hidden')) return;
                    if (gameRunning && !gameOver) {
                        if (paused) { paused = false; hidePauseOverlay(); updateUI(); } 
                        else { showPauseOverlay(); }
                    }
                    return;
                }
                if ([' ', 'arrowleft', 'arrowright'].includes(key)) e.preventDefault();
                if (!gameRunning || paused || gameOver) return;
                
                // 键盘按下时取消鼠标跟随控制，避免抢方向盘
                if (key === 'arrowleft' || key === 'a' || key === keyBinds.left) { keys.left = true; lastMouseMoveFrame = -1e9; }
                if (key === 'arrowright' || key === 'd' || key === keyBinds.right) { keys.right = true; lastMouseMoveFrame = -1e9; }
                if (key === ' ' || key === keyBinds.attack) keys.space = true;
                if (key === 'e' || key === keyBinds.skill) activateShield();
            });

            window.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'arrowleft' || key === 'a' || key === keyBinds.left) keys.left = false;
                if (key === 'arrowright' || key === 'd' || key === keyBinds.right) keys.right = false;
                if (key === ' ' || key === keyBinds.attack) keys.space = false;
            });

            // 触控事件 (手机端)
            canvas.addEventListener('touchstart', (e) => {
                if (!gameRunning || paused || gameOver) return;
                e.preventDefault();
                isTouching = true;
                const coords = getCanvasCoords(e);
                touchTargetX = coords.x;
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                if (!gameRunning || paused || gameOver) return;
                e.preventDefault();
                if (isTouching) {
                    const coords = getCanvasCoords(e);
                    touchTargetX = coords.x;
                }
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                isTouching = false;
            }, { passive: false });
            
            canvas.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                isTouching = false;
            }, { passive: false });

            // 鼠标事件 (电脑端方案二：鼠标移动跟随 + 左键攻击 + 右键技能，按键可在设置修改)
            canvas.addEventListener('mousedown', (e) => {
                if (!gameRunning || paused || gameOver) return;
                e.preventDefault(); 
                const coords = getCanvasCoords(e);
                touchTargetX = coords.x;
                if (e.button === mouseBinds.attack) { isTouching = true; keys.space = true; lastMouseMoveFrame = gameTime; }
                if (e.button === mouseBinds.skill) activateShield();
            });
            canvas.addEventListener('mousemove', (e) => {
                if (!gameRunning || paused || gameOver) return;
                // 鼠标移动即控制飞机（无需按住），持续移动则持续跟随
                const coords = getCanvasCoords(e);
                touchTargetX = coords.x;
                lastMouseMoveFrame = gameTime;
            });
            window.addEventListener('mouseup', (e) => { 
                isTouching = false;
                if (e.button === mouseBinds.attack) keys.space = false; 
            });
            
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());
            window.addEventListener('blur', () => { 
                keys = { left: false, right: false, space: false };

                        else resetGame(gameMode);
                        hideOverlays();
                    });
                } else { showStartOverlay(); }
            });

            resumeBtn.addEventListener('click', () => { paused = false; hidePauseOverlay(); updateUI(); });
            pauseBackBtn.addEventListener('click', () => { paused = false; hidePauseOverlay(); updateUI(); });
            settingsBackBtn.addEventListener('click', () => { settingsPanel.style.display = 'none'; });
            // 结算面板：确认=按settleAction跳转(默认主菜单)，继续=按continueAction执行
            function settleAndExit() {
                if (pendingVictoryGems > 0) { gems += pendingVictoryGems; pendingVictoryGems = 0; clearSave(); }
                deathContinueBtn.style.display = 'none';
                deathConfirmBtn.textContent = '✔ 确认返回菜单';
                const act = settleAction; settleAction = null; continueAction = null;
                persistProfile();
                if (act) act(); else showStartOverlay();
            }
            deathConfirmBtn.addEventListener('click', () => { settleAndExit(); });
            deathBackBtn.addEventListener('click', () => { settleAndExit(); });
            deathContinueBtn.addEventListener('click', () => {
                deathContinueBtn.style.display = 'none';
                deathConfirmBtn.textContent = '✔ 确认返回菜单';
                pendingVictoryGems = 0;
                const act = continueAction; continueAction = null; settleAction = null;
                if (act) act();
            });
            gameBackBtn.addEventListener('click', () => {
                if (gameRunning && !gameOver) { showPauseOverlay(); }
                else { showStartOverlay(); }
            });
            saveAndExitBtn.addEventListener('click', () => {
                if (saveGame()) { paused = false; hidePauseOverlay(); showStartOverlay(); }
                else { alert('保存失败，请重试'); }
            });

            settingsBtn.addEventListener('click', () => {
                settingsPanel.style.display = settingsPanel.style.display === 'none' ? 'block' : 'none';
            });

            // ===== 账号登录/注册/退出 =====
            const authLoginBtn = document.getElementById('authLoginBtn');
            authLoginBtn.addEventListener('click', () => {
                const msg = document.getElementById('authMsg');
                const name = document.getElementById('authUser').value.trim();
                const pwd = document.getElementById('authPass').value;
                const err = loginAccount(name, pwd);
                if (err) { msg.textContent = '⚠️ ' + err; }
                else {
                    document.getElementById('authUser').value = '';
                    document.getElementById('authPass').value = '';
                }
            });
            document.getElementById('authPass').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') authLoginBtn.click();
            });
            document.getElementById('authLogoutBtn').addEventListener('click', () => {
                if (gameRunning || gameOver) return; // 游戏进行中不允许切换账号
                logoutAccount();
            });
        }

        function anyOverlayOpen() {
            return [startOverlay, upgradeOverlay, pauseOverlay, difficultyOverlay,
                    deathOverlay, confirmOverlay, levelUpOverlay, levelSelectOverlay]
                .some(o => o && !o.classList.contains('hidden'));
        }

        function gameLoop() {
            try {
                // 防软锁看门狗：游戏进行中但处于暂停且没有任何弹窗时，自动恢复运行
                if (gameRunning && !gameOver && paused && !anyOverlayOpen()) {
                    console.warn('检测到暂停软锁，已自动恢复');
                    paused = false;
                }
                // 防软锁看门狗：游戏未运行且没有任何弹窗时，回到主菜单
                if (!gameRunning && !gameOver && !anyOverlayOpen()) {
                    showStartOverlay();
                }
                update();
                if (uiDirty) updateUI();
                draw();
            } catch (err) {
                // 任何单帧异常都不中断渲染循环，避免卡死
                console.error('游戏循环异常(已自动恢复):', err);
            }
            requestAnimationFrame(gameLoop);
        }

        function init() {
            loadKeybinds();
            initEvents();
            loadSettings();
            // 恢复上次登录的账号（刷新页面后保持登录）
            try {
                const s = localStorage.getItem(SESSION_KEY);
                if (s && getAccounts()[s]) currentUser = s;
            } catch(e) {}
            migrateOldSaves();     // 旧版无账号存档 → 游客命名空间
            loadProfileIntoGame(); // 载入当前身份的长期进度
            updateAuthUI();
            // 关闭/刷新页面前保存长期进度
            window.addEventListener('beforeunload', () => { persistProfile(); });
            volumeSfx.value = Math.round(sfxVolume * 100);
            volumeMusic.value = Math.round(musicVolume * 100);
            qualitySelect.value = qualitySetting;
            initStars();
            updateUI();
            showStartOverlay();
            updateSaveSlotUI();
            // 首次交互时启动音频 (浏览器要求用户手势后才能播放声音)
            ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, ensureAudio));
            gameLoop();
        }

        init();
    })();
</script>
</body>
</html>
